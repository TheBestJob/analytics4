name: Deploy static website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply light theme + contact forms to all blog articles
        run: |
          python3 << 'PY'
          import re
          from pathlib import Path

          LIGHT_STYLE = '''<style>
          *{box-sizing:border-box}body{margin:0;background:#fff;color:#0a0a0a;font-family:Inter,system-ui,Arial,sans-serif;line-height:1.7}
          header{padding:16px 5%;background:#0a0a0a;color:#fff;border-bottom:none}header a{color:#fff;text-decoration:none}header a:hover{color:#ff6a00}
          main{max-width:940px;margin:40px auto;padding:0 22px 48px}a{color:#ff6a00}
          .lang{display:flex;gap:18px;flex-wrap:wrap;margin:24px 0}.lang [aria-current]{font-weight:bold;text-decoration:underline}
          article img{max-width:100%;height:auto;border-radius:8px;margin:16px 0}article{overflow-wrap:anywhere}
          article h1{line-height:1.25;font-size:clamp(1.5rem,4vw,2rem);margin-bottom:12px;color:#0a0a0a}
          article h2{margin-top:36px;margin-bottom:12px;font-size:1.35rem;color:#0a0a0a}
          article h3{margin-top:24px;margin-bottom:8px;font-size:1.1rem;color:#0a0a0a}
          .summary{background:#FFF8F3;border:1px solid #FFE0CC;border-left:4px solid #ff6a00;border-radius:10px;padding:18px 20px;margin:24px 0}
          .summary strong{color:#ff6a00}.summary ul{margin:10px 0 0;padding-left:20px}
          .faq{margin-top:40px;border-top:1px solid #e5e5e5;padding-top:24px}
          .faq details{border:1px solid #e5e5e5;border-radius:10px;padding:14px 16px;margin:12px 0;background:#f5f5f5}
          .faq summary{cursor:pointer;font-weight:700;color:#0a0a0a}.faq details p{margin:12px 0 0;color:#525252}
          .cta{margin:40px 0;padding:24px;background:#f5f5f5;border-radius:12px;border:1px solid #e5e5e5;text-align:center}
          .cta a{display:inline-block;margin:8px;padding:12px 20px;background:#ff6a00;color:#fff;font-weight:700;border-radius:8px;text-decoration:none}
          ul{padding-left:22px}
          footer.blog-footer{background:#111;color:#a3a3a3;padding:28px 5%;text-align:center;font-size:.9rem;margin-top:24px}
          footer.blog-footer a{color:#a3a3a3}
          .blog-contact{margin:48px 0 24px;padding:28px 24px;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:12px}
          .blog-contact h2{margin:0 0 8px;font-size:1.25rem;color:#0a0a0a}
          .blog-contact p.lead{margin:0 0 18px;color:#525252;font-size:.95rem}
          .blog-contact form{display:grid;gap:12px;max-width:480px}
          .blog-contact input,.blog-contact textarea{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:8px;font:inherit;background:#fff;color:#0a0a0a;box-sizing:border-box}
          .blog-contact textarea{min-height:110px;resize:vertical}
          .blog-contact button{justify-self:start;background:#ff6a00;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.95rem}
          .blog-contact button:hover{background:#e55f00}
          .blog-contact .mail-line{margin-top:14px;font-size:.9rem;color:#525252}
          .blog-contact .mail-line a{color:#ff6a00}
          </style>
          <link rel="stylesheet" href="/assets/blog-article.css"/>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>'''

          FORM_CSS = '''
          .blog-contact{margin:48px 0 24px;padding:28px 24px;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:12px}
          .blog-contact h2{margin:0 0 8px;font-size:1.25rem;color:#0a0a0a}
          .blog-contact p.lead{margin:0 0 18px;color:#525252;font-size:.95rem}
          .blog-contact form{display:grid;gap:12px;max-width:480px}
          .blog-contact input,.blog-contact textarea{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:8px;font:inherit;background:#fff;color:#0a0a0a;box-sizing:border-box}
          .blog-contact textarea{min-height:110px;resize:vertical}
          .blog-contact button{justify-self:start;background:#ff6a00;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.95rem}
          .blog-contact button:hover{background:#e55f00}
          .blog-contact .mail-line{margin-top:14px;font-size:.9rem;color:#525252}
          .blog-contact .mail-line a{color:#ff6a00}
          '''

          def form_block(lang, slug):
            if lang == 'pl':
              email = 'magda@analytics4.online'
              subject = 'Kontakt ze strony blog Analytics 4 (PL)'
              h2 = 'Skontaktuj się z nami'
              lead = 'Masz pytania o Google Ads, GA4 lub lokalne SEO? Napisz – odpowiemy szybko.'
              ph = ('Imię i nazwisko', 'Email', 'Telefon (opcjonalnie)', 'Wiadomość', 'Wyślij wiadomość')
            elif lang == 'en':
              email = 'stefano@analytics4.online'
              subject = 'Contact from Analytics 4 blog (EN)'
              h2 = 'Get in touch'
              lead = 'Questions about Google Ads, GA4 or local SEO? Write to us – we reply quickly.'
              ph = ('Name', 'Email', 'Phone (optional)', 'Message', 'Send message')
            else:
              email = 'stefano@analytics4.online'
              subject = 'Contatto dal blog Analytics 4 (IT)'
              h2 = 'Contattaci'
              lead = 'Hai domande su Google Ads, GA4 o Local SEO? Scrivici: rispondiamo in tempi brevi.'
              ph = ('Nome', 'Email', 'Telefono (opzionale)', 'Messaggio', 'Invia messaggio')
            next_url = f'https://analytics4.online{slug}?sent=1'
            return f'''
<section class="blog-contact" id="contatti-articolo">
  <h2>{h2}</h2>
  <p class="lead">{lead}</p>
  <form action="https://formsubmit.co/{email}" method="POST">
    <input type="hidden" name="_subject" value="{subject}">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="{next_url}">
    <input type="text" name="name" placeholder="{ph[0]}" required>
    <input type="email" name="email" placeholder="{ph[1]}" required>
    <input type="tel" name="phone" placeholder="{ph[2]}">
    <textarea name="message" placeholder="{ph[3]}" required></textarea>
    <button type="submit">{ph[4]}</button>
  </form>
  <p class="mail-line">Email: <a href="mailto:{email}">{email}</a></p>
</section>
'''

          SKIP = {
            'Blog/index.html',
            'Blog/pl/index.html',
            'Blog/it/index.html',
            'Blog/en/index.html',
          }

          n_light = 0
          n_form = 0
          for path in sorted(Path('Blog').rglob('index.html')):
            rel = str(path).replace('\\', '/')
            if rel in SKIP:
              continue
            html = path.read_text(encoding='utf-8', errors='replace')

            # Skip pure redirects
            if 'http-equiv="refresh"' in html.lower() and len(html) < 3500 and '<article' not in html.lower():
              print('skip redirect:', rel)
              continue

            # Light theme
            html2, count = re.subn(r'<style>.*?</style>', LIGHT_STYLE, html, count=1, flags=re.S)
            if count == 0:
              if 'blog-article.css' not in html:
                html2 = html.replace('</head>', LIGHT_STYLE + '\n</head>', 1)
              else:
                html2 = html
            if count:
              n_light += 1

            # Language from path
            if rel.startswith('Blog/pl/'):
              lang = 'pl'
            elif rel.startswith('Blog/en/'):
              lang = 'en'
            else:
              lang = 'it'

            slug = '/' + rel.replace('/index.html', '/')
            if not slug.endswith('/'):
              slug += '/'

            # Remove existing form block then inject
            html2 = re.sub(r'<section class="blog-contact"[^>]*>.*?</section>\s*', '', html2, flags=re.S)
            block = form_block(lang, slug)

            if '</main>' in html2:
              html2 = html2.replace('</main>', block + '\n</main>', 1)
            elif re.search(r'<footer', html2, re.I):
              html2 = re.sub(r'(<footer)', block + r'\n\1', html2, count=1, flags=re.I)
            else:
              html2 = html2.replace('</body>', block + '\n</body>', 1)

            if 'blog-footer' not in html2 and '</body>' in html2:
              html2 = html2.replace('</body>', '<footer class="blog-footer">© Analytics 4</footer>\n</body>', 1)

            path.write_text(html2, encoding='utf-8')
            n_form += 1
            print(f'form [{lang}]:', rel)

          print(f'Done: light={n_light} forms={n_form}')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
